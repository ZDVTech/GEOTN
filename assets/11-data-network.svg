 <text x="471" y="544" text-anchor="middle" font-size="22" font-weight="700">Наземные шлюзы</text><text x="471" y="571" text-anchor="middle" font-size="17" fill="#a7bfc4">на каждой буровой</text></g>
 <use href="#satellite" x="653" y="159" width="263" height="143"/>
 <text x="778" y="332" text-anchor="middle" font-size="23" font-weight="700">Спутниковый канал</text><text x="778" y="361" text-anchor="middle" font-size="17" fill="#a7bfc4">где он доступен на объекте</text>
 <use href="#dish" x="937" y="294" width="132" height="115"/>
 <text x="1007" y="444" text-anchor="middle" font-size="20">Наземная станция</text>
 <rect x="642" y="578" width="390" height="54" rx="27" fill="#132f3a" stroke="#426b78"/>
 <text x="837" y="612" text-anchor="middle" fill="#bdd9de" font-size="20">Наземная сеть: LTE / проводная / иная</text>
