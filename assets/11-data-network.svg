 <text x="48" y="48" fill="#addc9b" font-size="16" letter-spacing="3">СЦЕНА 11 / ЦЕЛЕВАЯ СХЕМА ОБМЕНА</text>
 <text x="48" y="104" font-size="41" font-weight="700">Несколько буровых. Один информационный контур.</text>
 <text x="48" y="140" font-size="22" fill="#a7bfc4">Измерения → сервер Drill Monitor → специалисты → рекомендации и подтверждения</text>
