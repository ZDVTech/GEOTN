 <text x="1236" y="584" text-anchor="middle" font-size="27" font-weight="700" fill="#afe88c">Сервер Drill Monitor</text><text x="1236" y="614" text-anchor="middle" fill="#a7bfc4" font-size="18">Приём · история · обработка</text>
 <use href="#office" x="1369" y="242" width="185" height="132"/>
 <text x="1460" y="408" text-anchor="middle" font-size="22" font-weight="700">Центр сопровождения</text><text x="1460" y="437" text-anchor="middle" font-size="17" fill="#a7bfc4">Инженер / геонавигация / офис</text>
