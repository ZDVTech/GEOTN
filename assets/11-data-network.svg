<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Drill Monitor: несколько буровых, спутниковая связь, сервер и обратная связь инженеров</title>
<desc id="desc">Целевая схема. Измерения декодируются на поверхности, наземные шлюзы передают данные через спутниковый или доступный наземный канал на сервер. Специалисты возвращают рекомендации, полевая команда подтверждает получение. Это не спутниковая связь непосредственно со скважинными приборами.</desc>
