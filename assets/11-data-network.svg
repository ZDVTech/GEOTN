 <g><rect x="48" y="751" width="464" height="108" rx="12" fill="#102b35" stroke="#36545e"/><text x="68" y="782" font-size="20" font-weight="700">Отдельный скважинный канал</text><text x="68" y="812" font-size="19" fill="#c4d7db">MWD → импульсы давления → декодер</text><text x="68" y="840" font-size="17" fill="#89a8b3">Со спутником связывается наземное оборудование.</text>
 <rect x="532" y="751" width="490" height="108" rx="12" fill="#102b35" stroke="#36545e"/><text x="552" y="782" font-size="20" font-weight="700" fill="#65dcef">Что приходит в пакете</text><text x="552" y="812" font-size="19" fill="#c4d7db">ID скважины и рейса · время · измерения</text><text x="552" y="840" font-size="17" fill="#89a8b3">Глубина · единицы · источник · качество · события</text>
 <rect x="1042" y="751" width="510" height="108" rx="12" fill="#102b35" stroke="#36545e"/><text x="1062" y="782" font-size="20" font-weight="700" fill="#ffc576">Что идёт обратно</text><text x="1062" y="812" font-size="19" fill="#c4d7db">Рекомендация → инженер → подтверждение</text><text x="1062" y="840" font-size="17" fill="#89a8b3">Прямое управление приборами здесь не заявляется.</text></g>
 <text x="48" y="887" fill="#7798a4" font-size="15">Целевая архитектура: интеграции уточняются для внедрения. ИИ-поддержка — направление развития.</text>
</g></svg>
